<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel de pedidos de uma loja fictícia: faça um pedido e acompanhe estoque, pagamento e confirmação ao vivo."
    />
    <meta name="theme-color" content="#0f1b2d" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Balcão, painel de pedidos</title>
    <!-- Deferred scripts run in document order, so this one still runs before the app. -->
    <script defer src="%BASE_URL%config.js"></script>
    <script>
      // Before first paint, so the page never flashes in the wrong theme.
      try {
        var saved = localStorage.getItem('order-dashboard:theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este painel precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
