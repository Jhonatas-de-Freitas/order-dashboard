name: ci

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  # A run started by hand reads the repository as it is now. Useful right after the
  # repository becomes public, to publish without waiting for the next commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
      - run: npm run build:pages
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t order-dashboard:ci .
      - name: Start it pointing at another environment
        run: |
          docker run -d --name dashboard -p 5173:5173 \
            -e VITE_DEMO_MODE=false \
            -e VITE_API_URL=https://loja.example/api-gateway \
            order-dashboard:ci
          for attempt in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' dashboard)" = healthy ] && exit 0
            sleep 1
          done
          echo "the container did not become healthy" >&2
          exit 1
      - name: Check the app, the route fallback and the runtime settings
        run: |
          set -x
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          # An address that only exists in the browser still gets the app.
          curl -fsS http://localhost:5173/pedidos/7c1f0a34 | grep -q '<div id="root">'
          # A missing file under /assets must not be answered with the app.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/assets/missing.js)" = 404
          curl -fsSI http://localhost:5173/ | grep -qi '^cache-control: no-cache'
          curl -fsSI http://localhost:5173/ | grep -qi '^x-content-type-options: nosniff'
          asset=$(curl -fsS http://localhost:5173/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:5173$asset" | grep -qi '^cache-control: .*immutable'
          # What was passed at `docker run` wins; what was not keeps the default.
          curl -fsS http://localhost:5173/config.js -o "$RUNNER_TEMP/config.cjs"
          cat "$RUNNER_TEMP/config.cjs"
          node -e '
            globalThis.window = {};
            require(process.env.RUNNER_TEMP + "/config.cjs");
            const assert = require("node:assert/strict");
            assert.deepEqual(window.__ENV__, {
              VITE_DEMO_MODE: "false",
              VITE_API_URL: "https://loja.example/api-gateway",
              VITE_KEYCLOAK_URL: "http://localhost:8180",
              VITE_KEYCLOAK_REALM: "store",
              VITE_KEYCLOAK_CLIENT_ID: "store-web",
            });
          '
      - name: Container logs
        if: failure()
        run: docker logs dashboard

  # GitHub Pages only serves public repositories. One step is done by hand, once:
  # Settings > Pages > Source: GitHub Actions.
  deploy:
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_DEMO_MODE: 'true'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v5

  publish:
    needs: [quality, e2e, image]
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push with the tags latest and short SHA
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:latest" -t "$image:${GITHUB_SHA::7}" .
          docker push --all-tags "$image"
